<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irimanoa N. HJ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root { --bg: #fafbfc; --fg: #151a22; --accent: #1f4fd1; color-scheme: light dark; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0f131a; --fg: #e8ecf2; --accent: #8fb0ff; }
}
:root[data-theme="dark"] { --bg: #0f131a; --fg: #e8ecf2; --accent: #8fb0ff; }
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 16px;
  background: var(--bg);
  color: var(--fg);
  font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
  text-align: center;
}
h1 {
  margin: 0;
  font-weight: 600;
  font-size: clamp(2.3rem, 7vw, 3.6rem);
  line-height: 1.15;
  letter-spacing: -.015em;
  text-wrap: balance;
}
em { display: block; font-style: italic; font-weight: 400; color: var(--accent); }
</style>
</head>
<body>
  <h1>IRIMANOA <em>Nampoina Hiarijaona</em></h1>
</body>
</html>
